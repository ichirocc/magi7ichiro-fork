name: Android SDK

on:
  workflow_dispatch:
    inputs:
      upload_apk:
        description: "Upload built APKs as artifacts (may hit storage quota)"
        type: boolean
        default: false
  push:
    branches: [ main ]

# [3.568.0/外部レビュー] 既定は読み取りのみ（他 5 ワークフローと同じ）。このワークフローは
#   トークンを一切使わないので、既定の付与を明示的に絞っても動作は変わらない。
permissions:
  contents: read

jobs:
  android-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # [3.548.0] 旧 tools パッケージ消滅への対処（理由は v6-engine-check.yml の同じ箇所）。
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # [/code-review] 旧: wgetがリトライなし・キャッシュなしで毎回~200MBを再取得＝一時的なネットワーク
      #   不調でジョブごと失敗しうる無防備な単一ダウンロードだった。バージョン文字列固定のキーでキャッシュし
      #   （キャッシュヒット時はダウンロード自体をスキップ）、wget自体にもリトライを付ける（多重防御）。
      - name: Cache Gradle distribution
        id: gradle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gradle-dist
          key: gradle-dist-9.3.1

      - name: Install Gradle 9.3.1
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget -q --tries=3 --waitretry=5 -O /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          # [3.410.0/CI-03] 取得物を検証する。旧: チェックサムも署名も見ずに展開して PATH へ通していた＝
          #   配布元やネットワーク経路が入れ替わったものをそのまま実行していた。公式の
          #   gradle-9.3.1-bin.zip.sha256 の値を固定する（Gradle を上げるときはここも同時に更新する）。
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  /tmp/gradle.zip" | sha256sum -c -
          mkdir -p "$HOME/gradle-dist"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"

      - name: Add Gradle to PATH
        run: echo "$HOME/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Show Android SDK versions
        run: sdkmanager --list_installed || true

      - name: Show Gradle CLI
        run: gradle --version

      # [CP-SAT] OR-Tools（CP-SAT）を Android 向けに組んで APK の magi_native へ静的リンクする（docs/cpsat_formal.md）。
      #   初回は 1 時間前後かかるのでキャッシュする（OR-Tools の版とビルド手順のハッシュで鍵）。無ければ CP-SAT なしで組む（安全側）。
      - name: Install NDK for OR-Tools
        run: sdkmanager "ndk;26.1.10909125"

      - name: Cache OR-Tools (Android)
        id: ortools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ortools-android
          key: ortools-android-v9.12-${{ hashFiles('tools/native/build_ortools_android.sh') }}

      - name: Build OR-Tools (Android, CP-SAT)
        if: steps.ortools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone -q --depth 1 --branch v9.12 https://github.com/google/or-tools.git /tmp/or-tools
          bash tools/native/build_ortools_android.sh "$ANDROID_SDK_ROOT/ndk/26.1.10909125" /tmp/or-tools "$HOME/ortools-android/arm64-v8a" arm64-v8a
          rm -rf /tmp/or-tools

      - name: Use OR-Tools
        run: echo "MAGI_ORTOOLS_ANDROID=$HOME/ortools-android" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        id: build
        shell: bash
        run: |
          set +e
          gradle assembleDebug assembleRelease --stacktrace > build-debug.log 2>&1
          code=$?
          cat build-debug.log
          echo "$code" > build-exit-code.txt
          # [3.486.0] このステップは常に成功扱い（set +e）なので、後段の `if: failure()` は真にならない。
          #   終了コードを出力にして後段の条件に使う（-MAGI_PC 側 2026-09-04 の修正と同じ）。
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # [3.727.58] APK の libmagi_native.so が端末に無いライブラリを要求していないか（OR-Tools の依存物を共有で組むと
      #   端末で読み込めずネイティブ加速も CP-SAT も黙って無効になる＝3.727.51 の実機ログ）。整列・非圧縮も同じ検査で見る。
      - name: Check APK native libs (deps + stored + 16KiB aligned)
        if: ${{ steps.build.outputs.code == '0' }}
        run: python3 tools/check_apk_native_libs.py app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      # [レビュー指摘 2026-09-04] Android Lint が CI で一度も走っていなかった（build.gradle.kts は
      #   abortOnError=false・checkReleaseBuilds=false のため assemble では実行されず、下の
      #   「Upload lint reports」は生成元の無い空振り）。ビルドと独立に lintDebug を走らせて報告だけ残す
      #   （abortOnError=false のまま＝赤くはしない。閾値は build.gradle.kts の lint ブロックで決める）。
      - name: Android Lint (report only)
        if: ${{ always() && steps.build.outputs.code == '0' }}
        shell: bash
        continue-on-error: true
        run: gradle lintDebug --stacktrace > lint-debug.log 2>&1 || true; tail -40 lint-debug.log

      - name: Show build error summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "===== Build error summary ====="
          grep -n -E "(^e:|error:|FAILURE:|What went wrong|Unresolved reference|Compilation error|Execution failed|command not found)" build-debug.log | head -120 || true
          echo "===== '* What went wrong:' block (incl. lint findings) ====="
          awk '/\* What went wrong:/{f=1} f{print} /^\* Try:/{f=0}' build-debug.log | head -120 || true
          echo "===== Last 120 log lines ====="
          tail -120 build-debug.log || true

      # ログ／lint のアップロードはベストエフォート（GitHub のストレージ枠超過などで赤くしない）。
      # APK のアップロードは容量が大きく枠超過の注記を出しやすいため、既定ではスキップし、
      # 手動実行（workflow_dispatch）で upload_apk=true を指定したときのみ実行する。
      # ビルドの成否は最後の "Fail if build failed" で判定する。
      # 成功時の常時アップロードはストレージ枠を浪費するため、ログは失敗時のみ・短期保持。
      - name: Upload build log (on failure only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        # 旧: `failure()`＝ビルドステップが成功扱いのため常に偽で、失敗ログが一度も保存されなかった。
        if: ${{ always() && steps.build.outputs.code != '0' }}
        with:
          name: build-debug-log
          path: build-debug.log
          retention-days: 7

      - name: Upload lint reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        if: ${{ always() && hashFiles('**/build/reports/lint-results-*.*') != '' }}
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.*"
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        if: ${{ always() && github.event.inputs.upload_apk == 'true' && hashFiles('**/build/outputs/apk/debug/**/*.apk') != '' }}
        with:
          name: android-debug-apk
          path: "**/build/outputs/apk/debug/**/*.apk"
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        if: ${{ always() && github.event.inputs.upload_apk == 'true' && hashFiles('**/build/outputs/apk/release/**/*.apk') != '' }}
        with:
          name: android-release-apk
          path: "**/build/outputs/apk/release/**/*.apk"
          retention-days: 7

      - name: Upload any APK fallback
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        if: ${{ always() && github.event.inputs.upload_apk == 'true' && hashFiles('**/build/outputs/apk/**/*.apk') != '' }}
        with:
          name: android-apk-all
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 7

      - name: Fail if build failed
        shell: bash
        run: |
          code="$(cat build-exit-code.txt)"
          if [ "$code" != "0" ]; then
            echo "===== Build failed. Open this red step for the summary. ====="
            grep -n -E "(^e:|error:|FAILURE:|What went wrong|Unresolved reference|Compilation error|Execution failed|command not found)" build-debug.log | head -120 || true
            echo "===== '* What went wrong:' block (incl. lint findings) ====="
            awk '/\* What went wrong:/{f=1} f{print} /^\* Try:/{f=0}' build-debug.log | head -120 || true
            echo "===== Last 120 log lines ====="
            tail -120 build-debug.log || true
          fi
          exit "$code"
