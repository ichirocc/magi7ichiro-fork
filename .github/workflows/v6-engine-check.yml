name: V6 Engine Check

on:
  workflow_dispatch:
  push:
    # 作業ブランチ全般で走らせる。旧設定は特定のブランチ名（claude/code-review-0gu5p3）を
    # ハードコードしており、それ以外の作業ブランチへ push してもテストが1回も回らなかった
    # （PR を開くまで検証されない＝コミットを積んでから初めて失敗が分かる）。
    # concurrency で同一 ref の先行実行はキャンセルされるので、連続 push でも実行数は増えない。
    branches:
      # [3.320.0] main を追加。旧設定は作業ブランチしか含まず、main へ直接 push した場合は
      #   native-parity だけが走って Kotlin unit test と assembleDebug が実行されなかった
      #   （通常は PR 経由なので pull_request トリガーで走るが、直 push には穴があった）。
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read        # gate が同じコミットの成功済みの実行を探す
  pull-requests: read  # gate がマージした PR のコミットを引く

concurrency:
  group: v6-engine-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 同じ中身を 2 回検証しない: 作業ブランチを main と同じコミットへ戻しただけの push は、main 側の実行が同じコミットを検証済み。
  # ここで重ねて走らせると次の push で途中キャンセルされ、コミット一覧に ✗ が付く（3.688.0）。
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.cmp.outputs.skip }}
    steps:
      - id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            st=$(gh api "repos/${{ github.repository }}/compare/main...${{ github.sha }}" --jq .status || echo unknown)
            if [ "$st" = "identical" ] || [ "$st" = "behind" ]; then skip=true; fi
          fi
          # 作業ブランチ（claude/**）からの PR は、同じコミットを push 側の実行が検証済み。ブランチが最新の main を含む
          #   （behind_by=0）なら PR の取り込み結果は push したコミットと同じ中身なので重ねて走らせない。main が先へ進んでいたら走らせる。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            case "${{ github.head_ref }}" in
              claude/*)
                behind=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --jq .behind_by || echo unknown)
                if [ "$behind" = "0" ]; then skip=true; fi ;;
            esac
          fi
          # main へのマージ（スカッシュ）: マージしたコミットの中身（tree）が PR のコミットと同じで、そのコミットで
          #   この検査が成功済みなら重ねて走らせない（成功の記録が無ければ main でも走らせる）。
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            repo="${{ github.repository }}"
            tree=$(gh api "repos/$repo/commits/${{ github.sha }}" --jq .commit.tree.sha || echo none)
            for head in $(gh api "repos/$repo/commits/${{ github.sha }}/pulls" --jq '.[] | select(.merged_at != null) | .head.sha' || true); do
              htree=$(gh api "repos/$repo/commits/$head" --jq .commit.tree.sha || echo other)
              ok=$(gh api "repos/$repo/actions/runs?head_sha=$head&status=success" --jq '[.workflow_runs[] | select(.name == "V6 Engine Check")] | length' || echo 0)
              if [ "$tree" = "$htree" ] && [ "$ok" != "0" ]; then skip=true; fi
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  v6-engine-check:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # [3.548.0] 既定 "tools platform-tools" の旧 tools パッケージが SDK リポジトリから消え
          #   （2026-09-14 に run 386→387 で突然失敗）、setup 段で exit 1 になっていた。必要な
          #   パッケージは下の sdkmanager ステップで入れるので、ここでは platform-tools だけにする。
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      # [/code-review] キャッシュ+リトライ（android-sdk.ymlと同一パターン。旧: 無防備な単一wget）。
      - name: Cache Gradle distribution
        id: gradle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gradle-dist
          key: gradle-dist-9.3.1

      - name: Install Gradle 9.3.1
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget -q --tries=3 --waitretry=5 -O /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          # [3.410.0/CI-03] 取得物を検証する。旧: チェックサムも署名も見ずに展開して PATH へ通していた＝
          #   配布元やネットワーク経路が入れ替わったものをそのまま実行していた。公式の
          #   gradle-9.3.1-bin.zip.sha256 の値を固定する（Gradle を上げるときはここも同時に更新する）。
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  /tmp/gradle.zip" | sha256sum -c -
          mkdir -p "$HOME/gradle-dist"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"

      - name: Add Gradle to PATH
        run: echo "$HOME/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      # [HF77 の機械化] MirrorKeys.weights（20族の重みの単一の真実）の値が MirrorCore.kt 以外の
      #   v6/*.kt に生の数値リテラルとして紛れ込んでいないかを静的検査する（tools/weight_lint.py）。
      - name: Weight lint (MirrorKeys.weights source-of-truth check)
        run: python3 tools/weight_lint.py
      - name: Weight lint self-test
        run: python3 -m unittest tools/test_weight_lint.py

      - name: Run unit tests (engine + v6)
        shell: bash
        run: |
          mkdir -p build/ci-logs
          set -o pipefail
          gradle testDebugUnitTest --stacktrace 2>&1 | tee build/ci-logs/testDebugUnitTest.log

      - name: Assemble debug APK
        shell: bash
        run: |
          mkdir -p build/ci-logs
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build/ci-logs/assembleDebug.log

      # [3.552.0] APK 内の .so が非圧縮かつ 16KiB 境界か（Android 16 の 16KB ページ端末は APK から直接 mmap する）。
      - name: Check APK native libs (stored + 16KiB aligned)
        run: python3 tools/check_apk_native_libs.py app/build/outputs/apk/debug/*.apk

      # アーティファクト保存はベストエフォート。成功時は何もアップロードせず（ストレージ枠の
      # 浪費を防ぐ）、失敗時だけ短期保持でログを残す。ビルド用 APK はここでは保存しない
      # （必要なときは release-build.yml / android-sdk.yml で取得する）。
      - name: Upload CI logs (on failure only)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v6-engine-ci-logs
          path: build/ci-logs
          if-no-files-found: ignore
          retention-days: 7

