name: Cleanup Artifacts

# アーティファクト保存枠を解放するワークフロー。lint/失敗ログ/通常CI成果物は毎日無条件で全削除する
# （保存枠のためのハードコード。入力や日数による分岐は持たない）。
# [3.570.0/ユーザー決定] `app-release-*`（リリース APK）は対象外にし `retention-days: 14` を実際に保証する
# （経緯・将来課題は docs/environment.md・docs/backlog.md #21）。
# 明示ページング(listArtifactsForRepo)で total_count もログに出すので、
# 0 件なら本リポジトリに実体が無い（＝枠超過はアカウント共有枠/他リポジトリ起因）と確定できる。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-release artifacts (daily, release APK excluded)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // [3.570.0] release-build.yml の `name: app-release-${{ github.sha }}` と一致させる。
            const PROTECTED_PREFIX = 'app-release-';

            // 明示ページングで全件収集（paginate のラッパー差異を避ける）。
            let page = 1;
            const all = [];
            while (true) {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner, repo, per_page: 100, page,
              });
              core.info(`page ${page}: total_count=${res.data.total_count}, got=${res.data.artifacts.length}`);
              const arts = res.data.artifacts || [];
              if (arts.length === 0) break;
              all.push(...arts);
              if (arts.length < 100) break;
              page++;
            }
            core.info(`collected ${all.length} artifacts`);

            const protectedArts = all.filter(a => a.name.startsWith(PROTECTED_PREFIX));
            const targets = all.filter(a => !a.name.startsWith(PROTECTED_PREFIX));
            for (const a of protectedArts) core.info(`skip (protected) #${a.id} "${a.name}"`);

            // 対象（release APK 以外）は無条件で全削除。
            let deleted = 0, failed = 0, freedBytes = 0;
            for (const a of targets) {
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                deleted++; freedBytes += (a.size_in_bytes || 0);
                core.info(`deleted #${a.id} "${a.name}" (${a.size_in_bytes} bytes, created ${a.created_at})`);
              } catch (e) {
                failed++;
                core.warning(`failed to delete #${a.id} "${a.name}": ${e.message}`);
              }
            }

            const mib = (freedBytes / (1024 * 1024)).toFixed(1);
            const msg = `Deleted: ${deleted}/${targets.length} non-release artifacts (failed ${failed}), ` +
              `freed ~${mib} MiB. Protected (retention-days native): ${protectedArts.length}.`;
            core.notice(msg);
            // [レビュー指摘 2026-09-04] 旧: 削除失敗は core.warning だけで、権限・API・容量の問題で1件も
            //   消せなくても定期クリーンアップは緑のままだった。1件も消せなければジョブを失敗にする
            //   （一部失敗は従来どおり警告＝次回の定期実行で拾える）。
            if (targets.length > 0 && deleted === 0) core.setFailed(`No artifact could be deleted (${failed} failures)`);
            // [3.572.0/監査指摘] 「1件だけ削除成功・99件失敗」でもジョブは緑のまま＝個別 core.warning は
            //   ログ内に埋もれ気づけない。失敗が半数を超えたら集約 warning annotation（Checks タブに出る）を
            //   1本追加する。ジョブを失敗にはしない＝一時的なAPI/権限エラーは翌日の再実行で自然回復する
            //   （setFailed の既存方針を変えない）が、恒常的な権限・特定artifact問題を見逃さないための可視化。
            const failRate = targets.length > 0 ? failed / targets.length : 0;
            if (failed > 0 && failRate > 0.5) {
              core.warning(
                `Cleanup partially failed: ${failed}/${targets.length} artifacts could not be deleted ` +
                `(${(failRate * 100).toFixed(0)}%). Job still succeeded (${deleted} deleted) — check permissions/API errors above if this repeats.`,
              );
            }
            await core.summary
              .addHeading('Artifact cleanup (delete non-release, daily)')
              .addRaw(`${msg}. If total was 0, this repository holds no artifacts (quota is account-wide / other repos).`)
              .write();
