name: Release Build

# リリース用 APK を生成するワークフロー。
# - v* タグを打つと自動でリリース APK をビルドし、成果物としてアップロードする。
# - 手動実行（workflow_dispatch）では upload_apk=true のときだけアップロードする
#   （android-sdk.yml と同じく、ストレージ枠超過の注記を避けるためゲートする）。
# 署名: Secrets（MAGI_KEYSTORE_B64 / MAGI_KEYSTORE_PASSWORD / MAGI_KEY_ALIAS / MAGI_KEY_PASSWORD）が
#       あれば固定鍵で署名する＝上書きインストールできる。無ければデバッグ鍵（ランナーごとに変わり上書き不可）。
# 速度: gate（検査）と release（APK）は並列に走らせ、配布（Release 添付／手動実行の成果物）は両方が緑の後だけ。
on:
  workflow_dispatch:
    inputs:
      upload_apk:
        description: "Upload built release APK as an artifact (may hit storage quota)"
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

# [3.567.0/外部レビュー] 既定は読み取りのみ。書込みトークンは失敗報告 job だけが持つ。
#   旧: job 全体が contents:write を持ち、さらに GH_TOKEN を assembleRelease の env へ渡していた＝
#   Gradle プラグイン・ビルドスクリプト・ネイティブ子プロセスから書込みトークンを取得できた。
permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # [3.567.0/外部レビュー] v* タグは検査を通さずに配布物を作れてしまっていた。Android SDK の要らない
  #   2 つ（エンジンの JUnit と design_lint）を必須の前段にする。ここが赤ければ APK は作らない。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Design lint
        run: python3 tools/design_lint.py

      - name: Engine unit tests (host JVM)
        run: bash tools/host/hosttest.sh

  # [速度] 旧: needs: gate で直列（約 4.4 分＋2.8 分）。並列化し、配布側の job が両方を待つ。
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # [3.548.0] 旧 tools パッケージ消滅への対処（理由は v6-engine-check.yml の同じ箇所）。
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      # [/code-review] キャッシュ+リトライ（android-sdk.ymlと同一パターン。旧: 無防備な単一wget）。
      - name: Cache Gradle distribution
        id: gradle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gradle-dist
          key: gradle-dist-9.3.1

      - name: Install Gradle 9.3.1
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget -q --tries=3 --waitretry=5 -O /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          # [3.410.0/CI-03] 取得物を検証する。旧: チェックサムも署名も見ずに展開して PATH へ通していた＝
          #   配布元やネットワーク経路が入れ替わったものをそのまま実行していた。公式の
          #   gradle-9.3.1-bin.zip.sha256 の値を固定する（Gradle を上げるときはここも同時に更新する）。
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  /tmp/gradle.zip" | sha256sum -c -
          mkdir -p "$HOME/gradle-dist"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"

      - name: Add Gradle to PATH
        run: echo "$HOME/gradle-dist/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      # [3.567.0/外部レビュー] GH_TOKEN はここへ渡さない（Gradle の子プロセスに書込み権限を持たせない）。
      #   失敗の抜粋はファイルに残し、コミットへの書き込みは権限を持つ別 job が行う。
      # [上書きインストール] 固定鍵を Secrets から一時ファイルへ復元する（Secrets が無いフォークや PR では飛ばす）。
      - name: Restore signing key
        env:
          MAGI_KEYSTORE_B64: ${{ secrets.MAGI_KEYSTORE_B64 }}
        run: |
          if [ -n "$MAGI_KEYSTORE_B64" ]; then
            echo "$MAGI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/magi.keystore"
            echo "MAGI_KEYSTORE_FILE=$RUNNER_TEMP/magi.keystore" >> "$GITHUB_ENV"
            echo "## 署名: 固定鍵（上書きインストール可）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::MAGI_KEYSTORE_B64 が未設定のためデバッグ鍵で署名します（上書きインストール不可）"
            echo "## 署名: デバッグ鍵（上書きインストール不可。Secrets を設定してください）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build release APK
        env:
          MAGI_KEYSTORE_PASSWORD: ${{ secrets.MAGI_KEYSTORE_PASSWORD }}
          MAGI_KEY_ALIAS: ${{ secrets.MAGI_KEY_ALIAS }}
          MAGI_KEY_PASSWORD: ${{ secrets.MAGI_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || {
            { echo "[CI診断r4] Build失敗ログ抜粋:"; echo '```'; grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by" /tmp/build.log | head -60; echo '--- tail40 ---'; tail -n 40 /tmp/build.log; echo '```'; } > /tmp/errbody.txt
            exit 1
          }

      - name: Upload failure excerpt (on failure only)
        if: ${{ failure() && hashFiles('/tmp/errbody.txt') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: release-failure-excerpt
          path: /tmp/errbody.txt
          retention-days: 7

      # [3.552.0] APK 内の .so が非圧縮かつ 16KiB 境界か（理由は v6-engine-check.yml の同じ箇所）。
      - name: Print APK signer
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -m1 'SHA-256' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check APK native libs (stored + 16KiB aligned)
        run: python3 tools/check_apk_native_libs.py app/build/outputs/apk/release/*.apk

      # アップロードはベストエフォート（枠超過などで赤くしない）。
      # タグビルドでは常に、手動実行では upload_apk=true のときのみアップロードする。
      # [3.552.0] 失敗を緑のまま隠さない: 0 件は error 扱いにし、outcome を STEP_SUMMARY へ出す（MAGI-Godot run #3 の教訓）。
      # [backlog#21/2026-09-22/ユーザー明示go] タグビルドは GitHub Release アセットへ移すため、この
      #   アーティファクトは publish-release job への一時的な受け渡し用（名前を分けて cleanup-artifacts.yml の
      #   保護対象から外す＝保存枠は Release アセット側の別勘定になる）。手動実行（workflow_dispatch）は
      #   Release を作らないため従来どおり `app-release-*`・retention-days: 14 で保護を維持する。
      - name: Upload release APK
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        # [速度] gate と並列になったため、ここは常に一時受け渡し用（1 日）。gate が緑のときだけ
        #   publish-release / publish-artifact が配布物へ移す（gate 赤の APK は配布されない）。
        if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.upload_apk == 'true') && hashFiles('**/build/outputs/apk/release/**/*.apk') != '' }}
        with:
          name: release-apk-handoff-${{ github.sha }}
          path: "**/build/outputs/apk/release/**/*.apk"
          if-no-files-found: error
          retention-days: 1

      - name: Report upload outcome
        if: ${{ always() && steps.upload.outcome != 'skipped' }}
        run: |
          echo "## Release APK upload: ${{ steps.upload.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.upload.outcome }}" != "success" ]; then
            echo "成果物のアップロードに失敗しました（枠超過など）。ジョブは緑ですが成果物は 0 件です。" >> "$GITHUB_STEP_SUMMARY"
          fi

  # [backlog#21/2026-09-22/ユーザー明示go] タグビルドの APK を Actions アーティファクトでなく GitHub Release
  #   アセットへ添付する。書込みトークンは release job（Gradle 実行）に持たせず、この job だけに分離する
  #   （3.567.0で確立した「ビルドjobは読み取り専用」方針をそのまま踏襲）。
  publish-release:
    needs: [gate, release]
    if: ${{ always() && needs.gate.result == 'success' && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-apk-handoff-${{ github.sha }}
          path: release-apk

      - name: Create GitHub Release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          apk=$(find release-apk -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "APKが見つかりません"; exit 1; }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --title "$tag" \
              --notes "自動ビルド（動作確認用）。署名鍵は該当 run の Summary を参照。"
          fi

  # 手動実行の APK を、gate も緑のときだけ従来の名前 `app-release-*`（14 日保護）で残す。
  publish-artifact:
    needs: [gate, release]
    if: ${{ always() && needs.gate.result == 'success' && needs.release.result == 'success' && !startsWith(github.ref, 'refs/tags/v') && github.event.inputs.upload_apk == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-apk-handoff-${{ github.sha }}
          path: release-apk

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-${{ github.sha }}
          path: release-apk
          if-no-files-found: error
          retention-days: 14

  # 書込みトークンを持つのはこの job だけ。ビルドの成果物（失敗抜粋）を読んでコミットへ貼る。
  report-failure:
    needs: release
    if: ${{ always() && needs.release.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download failure excerpt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: release-failure-excerpt
          path: excerpt

      - name: Comment on commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=excerpt/errbody.txt
          [ -s "$body" ] || { echo "抜粋が無いので何も貼りません"; exit 0; }
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@"$body" || true
